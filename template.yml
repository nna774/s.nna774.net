AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Resources:
  ApiGateway:
    Name: s-nna774-net
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Domain:
        CertificateArn: arn:aws:acm:ap-northeast-1:486414336274:certificate/0c2a64fd-0793-4975-b418-c1596e14c5c0
        DomainName: s.nna774.net
      # 未設定だと画像添付の multipart/form-data ボディが API Gateway で
      # UTF-8 テキストとして扱われ、Lambda に届く前にバイト列が壊れる
      # (Gyazo が "Not an Image" で 400 を返す原因だった)。
      #
      # '*/*' で全レスポンスを binary 扱いにしたところ、レスポンスの
      # Accept ヘッダによる binary 判定がうまく効かず HTML/JSON まで
      # base64 の生文字列で返るようになり、サイト全体が壊れて即 revert
      # した。この Lambda がレスポンスとして multipart/form-data を返す
      # ことは無いので、multipart/form-data だけを対象にすればレスポンス
      # 側 (algnhsa の BinaryContentTypes) には一切影響しない。
      BinaryMediaTypes:
        - "multipart/form-data"
  Function:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri を省略すると SAM はテンプレートのあるディレクトリ全体を
      # zip し、秘密鍵・ソース・.git まで Lambda に同梱される。
      # lambda:GetFunction があれば誰でもそれを取得できる。
      # build/ には bootstrap と config.yml だけを置く (Makefile 参照)。
      CodeUri: build/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      FunctionName: s-nna774-net
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""
          DYNAMODB_TABLE_NAME: !Ref Table
          DYNAMODB_KV_TABLE_NAME: !Ref KVTable
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: any
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: any
      Role: !GetAtt FunctionRole.Arn
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: s-nna774-net
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: num
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: num
          KeyType: RANGE
      # 1人用インスタンスでトラフィックは実質ゼロなので、プロビジョンド
      # (1 RCU / 1 WCU で月 $0.65) よりオンデマンドの方が安く、かつ
      # 1 WCU で書き込みがスロットルする問題も起きない。
      BillingMode: PAY_PER_REQUEST
  # Table の sort key が数値なので、actor URI をキーに引けない。既存の
  # 12 件を危険にさらすキースキーマ変更は避け、キー引き用に別テーブルを
  # 立てる。オンデマンドなので費用は増えない。
  KVTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: s-nna774-net-kv
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      # 公開鍵キャッシュと重複配信の排除には期限がある。
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - lambda.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FunctionPolicies
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:List*
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:Get*
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:Update*
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt Table.Arn
                  - !GetAtt KVTable.Arn
              # 署名用の秘密鍵は SecureString として SSM に置く。
              # 標準階層 + AWS 管理キー (aws/ssm) なので費用は発生しない。
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/s.nna774.net/*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
Outputs:
  ApiURL:
    Description: "API endpoint URL for Prod environment"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod"
