# 正規のハンドル。webfinger の subject に出る。旧ハンドルで引かれても
# こちらへ誘導される。
# https://docs.joinmastodon.org/spec/webfinger/#mastodons-requirements-for-webfinger
username: 'nana@s.nna774.net'
alias_usernames:
  # nna774.net は webfinger を s.nna774.net に 302 リダイレクトしている
  # ため、旧ハンドルでも引ける。
  - nana@nna774.net
name: 久我山菜々
origin: https://s.nna774.net
icon_uri: https://nna774.net/img/1012_filtered.jpg
summary: B95 H108 S102
# プロフィールに並べる追加情報。Mastodon 系はこれを表として表示する。
# value が URL のときはリンクになり、リンク先に actor へ戻る rel="me" の
# リンクがあれば検証済みとして表示される。
fields:
  - name: Web
    value: https://nna774.net/
# 受け取った Follow を自動で Accept するか。false の場合は pending で
# 保留し、手動で Accept するまでフォロワーに数えない。
auto_accept_follow: true
# followers / following の中身と件数を公開しないか。
hide_collections: false
public_key_name: main-key
# private_key_file は ENV=development のときだけ使う。公開鍵は秘密鍵から
# 導出するので pub.key は読まない。
private_key_file: private.key
private_key_parameter: /s.nna774.net/private-key
# 私用エンドポイント (投稿・タイムライン・フォロー) の資格情報と、
# Cookie 署名用の HMAC 鍵。別に持つことで、後者を差し替えるだけで
# 全セッションを失効させられる。
api_token_parameter: /s.nna774.net/api-token
session_secret_parameter: /s.nna774.net/session-secret
