{{define "content"}}
<div class="profile">
  <div>
    <h2>いいね</h2>
    <div class="handle"><a href="/u/{{.LocalPart}}">プロフィールへ戻る</a></div>
  </div>
</div>

{{if .Items}}
  {{range .Items}}
    <article>
      <div class="who">
        {{if .IconURL}}<img src="{{.IconURL}}" alt="">{{end}}
        {{if .AuthorURI}}
          <a class="name" href="/remote?actor={{.AuthorURI}}">{{if .AuthorName}}{{.AuthorName}}{{else}}{{acct .AuthorURI}}{{end}}</a>
        {{end}}
      </div>
      <div class="meta">
        <a href="{{.ObjectURI}}">{{datetime .At}}</a>
      </div>
    </article>
  {{end}}
{{else}}
  <p class="empty">まだいいねしたものは無い。</p>
{{end}}
{{end}}
